[project]
name = "ultimate-frisbee-simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9,<4.0",
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
